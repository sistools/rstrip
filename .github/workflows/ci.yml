name: CI

on:
  push:
    branches:
      - master
      - boilerplate
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cell:
    name: CI (${{ matrix.id }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-clang
            os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
          - id: linux-gcc
            os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - id: macos-clang
            os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
          - id: macos-gcc
            os: macos-latest
            c_compiler: gcc
            cpp_compiler: g++
          - id: windows-cl
            os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - id: windows-mingw
            os: windows-latest
            c_compiler: mingw
            cpp_compiler: g++
    uses: ./.github/workflows/ci-cell.yml
    with:
      cell-id: ${{ matrix.id }}
      os: ${{ matrix.os }}
      c-compiler: ${{ matrix.c_compiler }}
      cpp-compiler: ${{ matrix.cpp_compiler }}
      build-type: Release
      with-clasp: true
      with-cstring: true
      with-test-deps: true
      run-tests: true
